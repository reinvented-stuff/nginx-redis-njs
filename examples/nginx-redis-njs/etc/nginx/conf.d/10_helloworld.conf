js_import /usr/share/nginx/njs/helloworld.js;
js_import /usr/share/nginx/njs/kv.js;

# --- Key/value example: shared settings -------------------------------------
#
# Writes and redis2 reads go through njs (usr/share/nginx/njs/kv.js).
# HttpRedis reads are plain nginx config, no njs involved.

js_set $redis_password kv.redis_password;   # from the REDIS_PASSWORD environment variable
js_var $kv_key;                             # set by njs, used by the internal redis2 locations
js_var $kv_value;
js_var $kv_ttl;

# Resolve "redis" at request time (Docker's DNS), so nginx still starts when
# Redis is absent, e.g. in the README's podman example. Only the key/value
# endpoints fail then.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream redis {
    zone redis 64k;
    server redis:6379 resolve;
    keepalive 4;
}

limit_req_zone $binary_remote_addr zone=kv_write:1m rate=5r/s;


server {
        # Not 10080: Chrome and Firefox refuse to connect to that port.
        listen 0.0.0.0:20080;
        listen 0.0.0.0:20443 ssl;

        ssl_certificate /etc/pki/tls/certs/helloworld.crt;
        ssl_certificate_key /etc/pki/tls/private/helloworld.key;

        server_name
            helloworld
            _
        ;

        access_log  /var/log/nginx/helloworld-access.log;
        access_log  /var/log/nginx/helloworld-access.json.log json;
        error_log  /var/log/nginx/helloworld-error.log info;

        charset utf-8;

        # The page uses no JavaScript, so scripts are blocked entirely.
        # Results load in a same-origin iframe, hence SAMEORIGIN rather than DENY.
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; frame-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Not "no-referrer": with it, browsers send "Origin: null" on the page's own
        # form posts, and the cross-site check in kv.js would refuse them.
        add_header Referrer-Policy "same-origin" always;

        redis_connect_timeout  1s;
        redis_read_timeout     2s;
        redis2_connect_timeout 1s;
        redis2_read_timeout    2s;

        location / {
                default_type text/html;
                js_content helloworld.index;
        }

        # --- Key/value example ----------------------------------------------

        # The page: usr/share/nginx/html/kv/
        location /kv/ {
                root /usr/share/nginx/html;
        }

        # Write: njs validates the form, then stores the value through redis2.
        location = /api/kv {
                limit_req            zone=kv_write burst=10 nodelay;
                limit_req_status     429;
                client_max_body_size 4k;
                js_content           kv.write;
        }

        # Read through redis2 + njs: njs parses the raw Redis protocol reply.
        location = /api/r2 {
                js_content kv.read;
        }

        # Read through HttpRedis: a GET by key, the value is the response body.
        location = /api/hr {
                if ($arg_key !~ "^[A-Za-z0-9_.-]{1,64}$") {
                        return 400 "key: 1-64 characters, letters, digits, . _ -\n";
                }
                set $redis_key   demo:$arg_key;
                set $redis_auth  $redis_password;
                redis_pass       redis;
                default_type     text/plain;
                error_page 404     = @kv_not_found;
                error_page 502 504 = @kv_unavailable;
        }

        # redis2 locations called by njs only. redis2_query sends every argument
        # length-prefixed, so values cannot inject commands. Never use
        # redis2_raw_query with user input.
        location = /_redis2/set {
                internal;
                redis2_query auth $redis_password;
                redis2_query set $kv_key $kv_value ex $kv_ttl;
                redis2_pass  redis;
        }

        location = /_redis2/get {
                internal;
                redis2_query auth $redis_password;
                redis2_query get $kv_key;
                redis2_query ttl $kv_key;
                redis2_pass  redis;
        }

        location @kv_not_found {
                default_type text/plain;
                return 404 "not found\n";
        }

        location @kv_unavailable {
                default_type text/plain;
                return 502 "redis unavailable\n";
        }

}
